# ======================
#  DATA SOURCE (MySQL)
# ======================
# Kreiraj bazu pre starta, npr:
#   CREATE DATABASE njt_rezervacije DEFAULT CHARACTER SET utf8mb4;
spring.datasource.url=jdbc:mysql://localhost:3306/njt_rezervacije?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Connection pool 
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000

# ======================
#  JPA / HIBERNATE
# ======================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Izbegava warning, koristi MySQL8+ dijalekt:
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# Vremenska zona
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ======================
#  SERVER
# ======================
# server.port=8080
# server.servlet.context-path=

# ======================
#  LOGGING  
# ======================
logging.level.root=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ======================
#  CORS (Angular dev na :4200)
# ======================
spring.web.cors.allowed-origins=http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

